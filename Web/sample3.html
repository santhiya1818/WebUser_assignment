<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simple Travel Booking - Demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --card-radius: 12px;
      --shadow-light: 0 6px 18px rgba(0,0,0,0.08);
      --shadow-strong: 0 14px 34px rgba(0,0,0,0.16);
      --accent: #0d6efd;
    }

    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background:#f7f8fb; }
    .hero {
      background: linear-gradient(180deg, rgba(13,110,253,0.9), rgba(13,110,253,0.8));
      color: #fff;
      padding: 3rem 0;
      text-align: center;
    }
    .search-card {
      border-radius: var(--card-radius);
      box-shadow: var(--shadow-light);
      background: #fff;
      padding: 1rem;
      margin-top: -2.5rem;
    }
    .dest-card {
      position: relative;
      border-radius: var(--card-radius);
      overflow: hidden;
      box-shadow: var(--shadow-light);
      background: #fff;
      transition: transform .22s ease, box-shadow .22s ease;
      cursor: pointer;
    }
    .dest-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-strong); }
    .dest-img {
      height: 160px;
      width: 100%;
      object-fit: cover;
      display: block;
    }
    .price-badge {
      position: absolute;
      right: 12px;
      top: 12px;
      background: var(--accent);
      color: #fff;
      padding: 6px 10px;
      border-radius: 999px;
      font-weight:600;
      font-size:.9rem;
      box-shadow: 0 6px 14px rgba(13,110,253,.2);
    }
    .card-overlay {
      padding: .9rem;
    }
    .range-value { font-weight:600; color:var(--accent); }
    @media (max-width:576px) {
      .hero { padding: 2rem 0; }
      .dest-img { height: 140px; }
      .search-card { margin-top: -2rem; padding:.8rem; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="container">
      <h1 class="display-6 mb-2">Find & Book Your Next Trip</h1>
      <p class="mb-0">Search destinations, view details and book tickets — demo using HTML5, CSS3, JS, jQuery & Bootstrap.</p>
    </div>
  </header>
  <main class="container">
    <div class="row justify-content-center">
      <div class="col-lg-10">
        <div class="search-card">
          <form id="tripSearchForm" class="row g-2 align-items-end">
            <div class="col-md-5">
              <label class="form-label mb-1">Destination</label>
              <input list="destList" id="destinationInput" class="form-control" placeholder="Type a city or choose..."
                     autocomplete="on" required>
              <datalist id="destList">
                <option value="Paris, France">
                <option value="Tokyo, Japan">
                <option value="New York, USA">
                <option value="Rome, Italy">
                <option value="Bangkok, Thailand">
              </datalist>
            </div>
            <div class="col-md-2">
              <label class="form-label mb-1">Travelers</label>
              <select id="travelersInput" class="form-select" required>
                <option value="">Choose</option>
                <option>1</option><option>2</option><option>3</option><option>4</option>
              </select>
            </div>
            <div class="col-md-2">
              <label class="form-label mb-1">Depart</label>
              <input id="departDate" type="date" class="form-control" required>
            </div>
            <div class="col-md-2">
              <label class="form-label mb-1">Return</label>
              <input id="returnDate" type="date" class="form-control" required>
            </div>
            <div class="col-md-1 text-end">
              <button type="submit" class="btn btn-primary w-100">Search</button>
            </div>
            <div class="col-12 mt-2">
              <label class="form-label">Max Budget: $<span id="budgetDisplay" class="range-value">1500</span></label>
              <input id="budgetRange" class="form-range" type="range" min="300" max="5000" step="50" value="1500">
            </div>
          </form>
        </div>
      </div>
    </div>
    <section class="row mt-4">
      <div class="col-lg-3 mb-3">
        <h6>Filter by region</h6>
        <div id="regionFilters" class="d-flex flex-column gap-2">
          <button class="btn btn-outline-secondary btn-sm" data-region="all">All</button>
          <button class="btn btn-outline-secondary btn-sm" data-region="europe">Europe</button>
          <button class="btn btn-outline-secondary btn-sm" data-region="asia">Asia</button>
          <button class="btn btn-outline-secondary btn-sm" data-region="america">America</button>
        </div>
        <hr>
        <small class="text-muted">Tip: click a destination card to view details and book.</small>
      </div>

      <div class="col-lg-9">
        <div id="destGrid" class="row g-3">
        </div>
      </div>
    </section>
  </main>
  <div class="modal fade" id="destModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="destModalTitle">Destination</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="destModalBody">
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button id="openBookingBtn" class="btn btn-success">Book Now</button>
        </div>
      </div>
    </div>
  </div>
  <div class="modal fade" id="bookingModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="bookingForm">
          <div class="modal-header">
            <h5 class="modal-title">Book Trip</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="mb-2">
              <label class="form-label">Full name</label>
              <input id="bookName" type="text" class="form-control" required minlength="2">
            </div>
            <div class="mb-2">
              <label class="form-label">Email</label>
              <input id="bookEmail" type="email" class="form-control" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Phone</label>
              <input id="bookPhone" type="tel" class="form-control" required pattern="[\d\s\-\+\(\)]{7,}">
            </div>
            <div class="mb-2">
              <label class="form-label">Notes (optional)</label>
              <textarea id="bookNotes" rows="2" class="form-control"></textarea>
            </div>
            <div id="bookingAlert" class="alert alert-danger d-none py-2" role="alert"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button id="confirmBooking" type="submit" class="btn btn-primary">Confirm</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <footer class="text-center py-4">
    <small class="text-muted">Demo travel booking • built with HTML5 / CSS3 / JS / jQuery / Bootstrap</small>
  </footer>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
  const destinations = [
    { id:1, name:'Paris, France', region:'europe', price:1200, days:'5 days',
      rating:4.8, img:'https://images.unsplash.com/photo-1502602898536-47ad22581b52?w=800', desc:'City of light with museums and cafes.' },
    { id:2, name:'Tokyo, Japan', region:'asia', price:1800, days:'7 days',
      rating:4.9, img:'https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?w=800', desc:'Modern city with tradition.' },
    { id:3, name:'New York, USA', region:'america', price:1500, days:'6 days',
      rating:4.7, img:'https://images.unsplash.com/photo-1496442226666-8d4d0e62e6e9?w=800', desc:'The city that never sleeps.' },
    { id:4, name:'Rome, Italy', region:'europe', price:1100, days:'5 days',
      rating:4.6, img:'https://images.unsplash.com/photo-1552832230-c0197dd311b5?w=800', desc:'History and great food.' }
  ];
  function formatPrice(p){ return '$' + p.toLocaleString(); }
  function renderGrid(region='all', maxBudget=Infinity){
    const $grid = $('#destGrid');
    $grid.empty();
    const filtered = destinations.filter(d => (region==='all' || d.region===region) && d.price <= maxBudget);
    if(filtered.length===0){
      $grid.append('<div class="col-12"><div class="p-4 bg-white rounded shadow-sm text-center">No results found.</div></div>');
      return;
    }
    filtered.forEach(d => {
      const col = $(`
        <div class="col-sm-6 col-lg-4">
          <article class="dest-card" data-id="${d.id}" role="button" tabindex="0" aria-pressed="false">
            <img class="dest-img" src="${d.img}" alt="${d.name}">
            <div class="price-badge">${formatPrice(d.price)}</div>
            <div class="card-overlay">
              <h6 class="mb-1">${d.name}</h6>
              <p class="text-muted small mb-1">${d.desc}</p>
              <div class="d-flex justify-content-between align-items-center">
                <span class="badge bg-info text-dark">${d.days}</span>
                <small class="text-muted">${d.rating} ★</small>
              </div>
            </div>
          </article>
        </div>
      `);
      col.find('.dest-card').on('click keypress', function(e){
        if(e.type==='click' || (e.type==='keypress' && (e.key==='Enter' || e.key===' '))){
          showDetails($(this).data('id'));
        }
      });
      $grid.append(col);
    });
  }
  function showDetails(id){
    const dest = destinations.find(d=>d.id===id);
    if(!dest) return;
    $('#destModalTitle').text(dest.name);
    $('#destModalBody').html(`
      <img src="${dest.img}" class="img-fluid rounded mb-3" alt="${dest.name}">
      <p>${dest.desc}</p>
      <div class="row">
        <div class="col-sm-6"><strong>Duration:</strong> ${dest.days}</div>
        <div class="col-sm-6"><strong>Price:</strong> ${formatPrice(dest.price)}</div>
      </div>
    `);
    $('#openBookingBtn').data('dest-id', id);
    const modal = new bootstrap.Modal(document.getElementById('destModal'));
    modal.show();
  }
  $(function(){
    const today = new Date().toISOString().split('T')[0];
    $('#departDate, #returnDate').attr('min', today);
    $('#budgetRange').on('input', function(){
      $('#budgetDisplay').text(this.value);
    });
    renderGrid();
    $('#regionFilters').on('click', 'button', function(){
      $('#regionFilters button').removeClass('btn-secondary').addClass('btn-outline-secondary');
      $(this).removeClass('btn-outline-secondary').addClass('btn-secondary');
      const region = $(this).data('region');
      const budget = Number($('#budgetRange').val());
      $('#destGrid').fadeOut(150, function(){ renderGrid(region, budget); $(this).fadeIn(250); });
    });
    $('#tripSearchForm').on('submit', function(e){
      e.preventDefault();
      const dest = $('#destinationInput').val().trim();
      const depart = $('#departDate').val();
      const ret = $('#returnDate').val();
      if(!dest){ alert('Please enter a destination.'); $('#destinationInput').focus(); return; }
      if(!depart || !ret){ alert('Please choose valid dates.'); return; }
      if(new Date(ret) <= new Date(depart)){ alert('Return must be after departure.'); return; }
      const budget = Number($('#budgetRange').val());
      renderGrid('all', budget);
      $('html,body').animate({ scrollTop: $('#destinationsAnchor').offset().top - 70 }, 600);
    });
    $('<div id="destinationsAnchor"></div>').insertBefore('#destGrid');
    $('#openBookingBtn').on('click', function(){
      const id = $(this).data('dest-id');
      $('#destModal').modal('hide');
      $('#bookingForm')[0].reset();
      $('#bookingAlert').addClass('d-none').text('');
      $('#confirmBooking').data('dest-id', id);
      const bookModal = new bootstrap.Modal(document.getElementById('bookingModal'));
      bookModal.show();
    });
    $('#bookingForm').on('submit', function(e){
      e.preventDefault();
      const name = $('#bookName').val().trim();
      const email = $('#bookEmail').val().trim();
      const phone = $('#bookPhone').val().trim();
      const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if(name.length < 2){ showBookingError('Please enter your name (min 2 characters).'); return; }
      if(!emailRe.test(email)){ showBookingError('Please enter a valid email.'); return; }
      if(phone.length < 7){ showBookingError('Please enter a valid phone number.'); return; }
      $('#confirmBooking').prop('disabled', true).text('Booking...');
      setTimeout(()=> {
        $('#confirmBooking').prop('disabled', false).text('Confirm');
        $('#bookingModal').modal('hide');
        alert('Booking confirmed! A confirmation email will be sent.');
      }, 900);
    });
    function showBookingError(msg){
      $('#bookingAlert').removeClass('d-none').text(msg);
    }
  });
  </script>
</body>
</html>
