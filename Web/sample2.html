<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --card-bg: #f8f9fa;
            --border-color: #dee2e6;
            --sidebar-bg: #e9ecef;
        }

        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #ffffff;
            --card-bg: #2d2d2d;
            --border-color: #404040;
            --sidebar-bg: #262626;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: all 0.3s ease;
        }
        .sidebar {
            background-color: var(--sidebar-bg);
            min-height: 100vh;
            padding: 20px;
            border-right: 1px solid var(--border-color);
        }
        .main-content {
            padding: 20px;
        }
        .dashboard-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        .dashboard-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            border-radius: 50px;
            padding: 10px 15px;
        }
        .panel-header {
            cursor: pointer;
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 5px;
            border: 1px solid var(--border-color);
            margin-bottom: 10px;
        }
        .panel-content {
            display: none;
            padding: 15px;
            background-color: var(--card-bg);
            border-radius: 5px;
            border: 1px solid var(--border-color);
        }
        .progress-bar {
            transition: width 1s ease-in-out;
        }
        @media (max-width: 768px) {
            .sidebar {
                min-height: auto;
                padding: 10px;
            }          
            .main-content {
                padding: 10px;
            }          
            .dashboard-card {
                padding: 15px;
                margin-bottom: 15px;
            }           
            .theme-toggle {
                top: 10px;
                right: 10px;
                padding: 8px 12px;
            }
        }
        @media (max-width: 576px) {
            .sidebar {
                text-align: center;
            }            
            .dashboard-card h5 {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <button class="btn btn-outline-secondary theme-toggle" id="themeToggle">
        <i class="fas fa-moon" id="themeIcon"></i>
    </button>
    <div class="container-fluid">
        <div class="row">
            <aside class="col-lg-3 col-md-4 sidebar">
                <header class="mb-4">
                    <h3><i class="fas fa-chart-dashboard me-2"></i>Dashboard</h3>
                    <p class="text-muted">Employee Performance</p>
                </header>                
                <nav>
                    <h5>Filters</h5>
                    <div class="mb-3">
                        <label class="form-label">Department:</label>
                        <select class="form-select" id="departmentFilter">
                            <option value="all">All Departments</option>
                            <option value="it">IT</option>
                            <option value="hr">HR</option>
                            <option value="sales">Sales</option>
                            <option value="marketing">Marketing</option>
                        </select>
                    </div>                    
                    <div class="mb-3">
                        <label class="form-label">Performance Level:</label>
                        <select class="form-select" id="performanceFilter">
                            <option value="all">All Levels</option>
                            <option value="excellent">Excellent (90%+)</option>
                            <option value="good">Good (70-89%)</option>
                            <option value="average">Average (50-69%)</option>
                        </select>
                    </div>                    
                    <button class="btn btn-primary w-100" id="applyFilters">
                        <i class="fas fa-filter me-2"></i>Apply Filters
                    </button>
                </nav>
            </aside>
            <main class="col-lg-9 col-md-8 main-content">
                <header class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2>Employee Performance Dashboard</h2>
                        <p class="text-muted mb-0" id="currentTime"></p>
                    </div>
                </header>
                <section class="row mb-4">
                    <div class="col-xl-3 col-lg-6 col-md-6 col-sm-6 mb-3">
                        <div class="dashboard-card text-center">
                            <i class="fas fa-users fa-2x text-primary mb-2"></i>
                            <h5>Total Employees</h5>
                            <h3 id="totalEmployees">150</h3>
                        </div>
                    </div>                    
                    <div class="col-xl-3 col-lg-6 col-md-6 col-sm-6 mb-3">
                        <div class="dashboard-card text-center">
                            <i class="fas fa-star fa-2x text-success mb-2"></i>
                            <h5>Top Performers</h5>
                            <h3 id="topPerformers">45</h3>
                        </div>
                    </div>                    
                    <div class="col-xl-3 col-lg-6 col-md-6 col-sm-6 mb-3">
                        <div class="dashboard-card text-center">
                            <i class="fas fa-chart-line fa-2x text-info mb-2"></i>
                            <h5>Avg Performance</h5>
                            <h3 id="avgPerformance">78%</h3>
                        </div>
                    </div>                    
                    <div class="col-xl-3 col-lg-6 col-md-6 col-sm-6 mb-3">
                        <div class="dashboard-card text-center">
                            <i class="fas fa-building fa-2x text-warning mb-2"></i>
                            <h5>Departments</h5>
                            <h3 id="totalDepartments">4</h3>
                        </div>
                    </div>
                </section>
                <section class="mb-4">
                    <div class="panel-header" data-panel="department-stats">
                        <h5><i class="fas fa-chevron-right me-2"></i>Department Performance</h5>
                    </div>
                    <div class="panel-content" id="department-stats">
                        <div class="row" id="departmentStats">
                        </div>
                    </div>
                </section>
                <section class="mb-4">
                    <div class="panel-header" data-panel="employee-list">
                        <h5><i class="fas fa-chevron-right me-2"></i>Employee List</h5>
                    </div>
                    <div class="panel-content" id="employee-list">
                        <div class="table-responsive">
                            <table class="table table-striped" id="employeeTable">
                                <thead>
                                    <tr>
                                        <th>Name</th>
                                        <th>Department</th>
                                        <th>Performance</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody id="employeeTableBody">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <script>
        const employees = [
            { name: "John Smith", department: "it", performance: 92, status: "Active" },
            { name: "Sarah Johnson", department: "hr", performance: 88, status: "Active" },
            { name: "Mike Davis", department: "sales", performance: 75, status: "Active" },
            { name: "Lisa Wilson", department: "marketing", performance: 95, status: "Active" },
            { name: "Tom Brown", department: "it", performance: 82, status: "Active" },
            { name: "Emma Garcia", department: "sales", performance: 67, status: "Active" },
            { name: "David Miller", department: "hr", performance: 91, status: "Active" },
            { name: "Amy Chen", department: "marketing", performance: 78, status: "Active" }
        ];
        const departments = {
            it: { name: "IT", performance: 87, employees: 3 },
            hr: { name: "HR", performance: 89, employees: 2 },
            sales: { name: "Sales", performance: 71, employees: 2 },
            marketing: { name: "Marketing", performance: 86, employees: 2 }
        };
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';           
            document.documentElement.setAttribute('data-theme', newTheme);
            const themeIcon = document.getElementById('themeIcon');
            themeIcon.className = newTheme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
            localStorage.setItem('theme', newTheme);
        }
        function loadTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);           
            const themeIcon = document.getElementById('themeIcon');
            themeIcon.className = savedTheme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleString();
            document.getElementById('currentTime').textContent = `Last Updated: ${timeString}`;
        }
        function loadDepartmentStats() {
            const container = document.getElementById('departmentStats');
            container.innerHTML = '';           
            Object.keys(departments).forEach(key => {
                const dept = departments[key];
                const progressColor = getProgressColor(dept.performance);               
                const deptCard = `
                    <div class="col-lg-6 col-md-12 mb-3">
                        <div class="dashboard-card">
                            <h6>${dept.name} Department</h6>
                            <p class="text-muted">${dept.employees} employees</p>
                            <div class="progress mb-2" style="height: 20px;">
                                <div class="progress-bar bg-${progressColor}" 
                                     role="progressbar" 
                                     style="width: ${dept.performance}%" 
                                     data-performance="${dept.performance}">
                                    ${dept.performance}%
                                </div>
                            </div>
                            <small class="text-muted">Performance Score</small>
                        </div>
                    </div>
                `;
                container.innerHTML += deptCard;
            });
            setTimeout(() => {
                $('.progress-bar').each(function() {
                    const performance = $(this).data('performance');
                    $(this).css('width', '0%').animate({width: performance + '%'}, 1000);
                });
            }, 100);
        }
        function getProgressColor(performance) {
            if (performance >= 90) return 'success';
            if (performance >= 70) return 'info';
            if (performance >= 50) return 'warning';
            return 'danger';
        }
        function loadEmployeeTable(filteredEmployees = employees) {
            const tbody = document.getElementById('employeeTableBody');
            tbody.innerHTML = '';            
            filteredEmployees.forEach(emp => {
                const statusBadge = emp.status === 'Active' ? 'success' : 'secondary';
                const performanceColor = getProgressColor(emp.performance);               
                const row = `
                    <tr>
                        <td>${emp.name}</td>
                        <td><span class="badge bg-primary">${departments[emp.department].name}</span></td>
                        <td>
                            <div class="progress" style="height: 15px; width: 100px;">
                                <div class="progress-bar bg-${performanceColor}" 
                                     style="width: ${emp.performance}%"></div>
                            </div>
                            <small>${emp.performance}%</small>
                        </td>
                        <td><span class="badge bg-${statusBadge}">${emp.status}</span></td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }
        function filterData() {
            const deptFilter = document.getElementById('departmentFilter').value;
            const perfFilter = document.getElementById('performanceFilter').value;           
            let filtered = employees;
            if (deptFilter !== 'all') {
                filtered = filtered.filter(emp => emp.department === deptFilter);
            }
            if (perfFilter !== 'all') {
                switch(perfFilter) {
                    case 'excellent':
                        filtered = filtered.filter(emp => emp.performance >= 90);
                        break;
                    case 'good':
                        filtered = filtered.filter(emp => emp.performance >= 70 && emp.performance < 90);
                        break;
                    case 'average':
                        filtered = filtered.filter(emp => emp.performance >= 50 && emp.performance < 70);
                        break;
                }
            }           
            loadEmployeeTable(filtered);
            updateStats(filtered);
        }
        function updateStats(filteredEmployees) {
            document.getElementById('totalEmployees').textContent = filteredEmployees.length;
            
            const topPerformers = filteredEmployees.filter(emp => emp.performance >= 90).length;
            document.getElementById('topPerformers').textContent = topPerformers;
            
            const avgPerf = filteredEmployees.reduce((sum, emp) => sum + emp.performance, 0) / filteredEmployees.length;
            document.getElementById('avgPerformance').textContent = Math.round(avgPerf) + '%';
        }
        $(document).ready(function() {
            // Initialize
            loadTheme();
            updateTime();
            loadDepartmentStats();
            loadEmployeeTable();
            setInterval(updateTime, 60000);
            $('#themeToggle').on('click', toggleTheme);
            $('#applyFilters').on('click', function() {
                $(this).html('<i class="fas fa-spinner fa-spin me-2"></i>Filtering...');               
                setTimeout(() => {
                    filterData();
                    $(this).html('<i class="fas fa-filter me-2"></i>Apply Filters');
                }, 500);
            });
            $('.panel-header').on('click', function() {
                const panelId = $(this).data('panel');
                const panelContent = $('#' + panelId);
                const icon = $(this).find('i');
                panelContent.slideToggle(300, function() {
                    if (panelContent.is(':visible')) {
                        icon.removeClass('fa-chevron-right').addClass('fa-chevron-down');
                    } else {
                        icon.removeClass('fa-chevron-down').addClass('fa-chevron-right');
                    }
                });
            });
            $('.dashboard-card').hover(
                function() { $(this).addClass('shadow-lg'); },
                function() { $(this).removeClass('shadow-lg'); }
            );
        });
    </script>
</body>
</html>
